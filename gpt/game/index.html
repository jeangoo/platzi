<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="info">
      <h1>Word Scramble</h1>
      <span id="word"></span>
      <p>Hint: <span id="hint"></span></p>
      <p>Time left: <span id="timer-display">30</span>s</p>
      </div>
      <div class="input">
      <small class="advice"></small>
      <input type="text" id="guess-input" placeholder="Enter a valid word" />
      </div>

      <div class="buttons">
        <button id="refresh">Refresh Word</button>
        <button id="check">Check Word</button>
      </div>
    </div>

    <div class="backdrop"></div>

    <div class="congrats-modal">Congrats!</div>
    <div class="loose-modal">You loose!</div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
